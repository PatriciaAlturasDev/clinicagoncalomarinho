<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F7F6F2" />
  <title>Pedido Enviado | Clínica Gonçalo Marinho</title>
  <meta name="description" content="O seu pedido de marcação de consulta foi enviado com sucesso. Entraremos em contacto brevemente." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/areas-data.js" defer></script>
  <script src="js/team-data.js" defer></script>
  <script src="js/dom-utils.js" defer></script>
  <script src="js/url-utils.js" defer></script>
  <script src="js/img-fallback.js" defer></script>
  <script src="js/header.js" defer></script>
  <script src="js/footer.js" defer></script>
  <script src="js/whatsapp-float.js" defer></script>
  <script src="js/scroll-reveal.js" defer></script>
  <script src="js/area-cta.js" defer></script>
  <script src="js/manifest-grid.js" defer></script>
  <script src="js/area-detail.js" defer></script>
  <script src="js/home-areas.js" defer></script>
  <script src="js/home-approach.js" defer></script>
  <script src="js/team-grid.js" defer></script>
  <script src="js/team-detail.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/libphonenumber-js@1/bundle/libphonenumber-js.min.js" defer></script>
  <script src="js/booking-form.js" defer></script>
  <script src="js/spa-router.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body class="page-marcacao-confirmada">
  <div id="site-header"></div>
  <main>
    <!-- CONFIRMAÇÃO DE MARCAÇÃO — booking-form.js redirects here after a
         successful Web3Forms submission. Reuses .booking-hero's decor and
         .booking-head's title/text styling from marcar-consulta.html, so
         it reads as the same flow rather than a different page. -->
    <section class="booking-hero">
      <img src="assets/vector-blue.svg" alt="" class="booking-decor booking-decor--blue" aria-hidden="true" />
      <img src="assets/vector-red-bottom.svg" alt="" class="booking-decor booking-decor--red" aria-hidden="true" />
      <span class="booking-dot booking-dot--yellow" aria-hidden="true"></span>

      <div class="booking-container">
        <div class="booking-confirmation">
          <img src="assets/consultas-hero-image.svg" alt="" class="booking-confirmation-image" />
          <div class="booking-head">
            <h1>Pedido enviado com sucesso!</h1>
            <p>A nossa equipa vai analisar o seu pedido e entraremos em contacto consigo no prazo máximo de <strong>24 horas</strong>.</p>
          </div>
          <a href="index.html" class="booking-submit">Voltar à página inicial</a>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
</body>
</html>
